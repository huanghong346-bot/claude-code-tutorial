<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学习 Claude Code - 入门教程</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- 目录按钮（手机端） -->
    <div id="mobile-menu-btn" class="lg:hidden fixed top-4 left-4 z-50">
        <button class="bg-orange-500 text-white px-4 py-2 rounded-lg shadow-lg hover:bg-orange-600 active:bg-orange-700 transition-colors">
            📋 目录
        </button>
    </div>

    <!-- 侧边栏抽屉（手机端） -->
    <div id="sidebar-drawer" class="lg:hidden fixed inset-0 z-40 hidden">
        <div id="drawer-backdrop" class="absolute inset-0 bg-black/50"></div>
        <div class="absolute left-0 top-0 bottom-0 w-64 bg-white shadow-xl transform transition-transform">
            <!-- 目录内容 -->
            <div class="p-4">
                <h3 class="font-bold text-lg mb-4">学习目录</h3>
                <div id="sidebar-content-mobile"></div>
                <div class="ad-slot-sidebar mt-4 flex items-center justify-center border-2 border-dashed border-gray-200 bg-gray-50 text-gray-400 text-xs" style="width:300px;height:250px">
                    <!-- 在此处替换为广告联盟代码 -->
                </div>
            </div>
        </div>
    </div>

    <!-- 主容器 -->
    <div class="flex min-h-screen">
        <!-- 侧边栏（桌面端） -->
        <aside class="hidden lg:block w-60 bg-white border-r border-gray-200 fixed h-full overflow-y-auto top-0 left-0 z-20">
            <div class="p-6">
                <h2 class="font-bold text-xl mb-6 text-orange-600">学习目录</h2>
                <div id="sidebar-content-desktop"></div>
                <div class="ad-slot-sidebar mt-4 flex items-center justify-center border-2 border-dashed border-gray-200 bg-gray-50 text-gray-400 text-xs" style="width:300px;height:250px">
                    <!-- 在此处替换为广告联盟代码 -->
                </div>
            </div>
        </aside>

        <!-- 步骤进度条容器 -->
        <div id="step-progress-container" class="z-10"></div>

        <!-- 主内容区域 -->
        <main class="flex-1 lg:ml-60 pt-14">
            <div class="max-w-4xl mx-auto px-4 py-8">
                <!-- 平台切换Tab（桌面端） -->
                <div class="hidden lg:flex justify-end mb-6">
                    <div id="platform-tabs-desktop"></div>
                </div>

                <!-- 平台切换Tab（手机端） -->
                <div class="lg:hidden mb-6">
                    <div id="platform-tabs-mobile"></div>
                </div>

                <div id="main-content" class="bg-white rounded-xl shadow-sm p-8">
                    <!-- 测试内容区域 -->
                </div>
            </div>
        </main>
    </div>

    <!-- JavaScript -->
    <script src="js/storage-utils.js"></script>
    <script src="js/app.js"></script>
    <script src="js/quiz.js"></script>
    <script src="js/progress.js"></script>
    <script src="js/platform.js"></script>
    <script src="js/steps.js"></script>
    <script src="js/copy.js"></script>
    <script src="js/lesson-quiz.js"></script>
    <script src="js/checklist.js"></script>
    <script src="js/rating-modal.js"></script>

    <!-- 模块内容 -->
    <script src="content/module-1.js"></script>
    <script src="content/module-2.js"></script>
    <script src="content/module-3.js"></script>
    <script src="content/module-3b.js"></script>
    <script src="content/module-3c.js"></script>
    <script src="content/module-4.js"></script>
    <script src="content/module-5.js"></script>
    <script src="content/module-6.js"></script>
    <script src="content/module-7.js"></script>
    <script src="content/module-8.js"></script>
    <script src="content/module-feedback.js"></script>

    <script>
        // 全局应用实例
        let app;
        let platformSwitcher;
        let codeCopyButton;

        // 手机端侧边栏切换
        function toggleSidebar() {
            const drawer = document.getElementById('sidebar-drawer');
            if (drawer) {
                drawer.classList.toggle('hidden');
            }
        }

        // 关闭手机端抽屉（供App调用）
        function closeMobileDrawer() {
            const drawer = document.getElementById('sidebar-drawer');
            if (drawer) {
                drawer.classList.add('hidden');
            }
        }

        // 初始化应用
        document.addEventListener('DOMContentLoaded', function() {
            // 初始化App
            app = new App();
            window.app = app;

            // 初始化平台切换器
            platformSwitcher = new PlatformSwitcher();
            window.platformSwitcher = platformSwitcher;

            // 初始化代码复制按钮
            codeCopyButton = new CodeCopyButton();
            window.codeCopyButton = codeCopyButton;

            // 移动端目录按钮点击事件
            const mobileMenuBtn = document.getElementById('mobile-menu-btn');
            if (mobileMenuBtn) {
                mobileMenuBtn.addEventListener('click', toggleSidebar);
            }

            // 如果URL有hash，导航到对应模块
            if (window.location.hash) {
                const moduleId = window.location.hash.substring(1);
                if (app.modules.find(m => m.id === moduleId)) {
                    app.navigateToModule(moduleId);
                }
            }
        });
    </script>
</body>
</html>
