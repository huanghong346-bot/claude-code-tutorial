  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#fff7ed',
              100: '#ffedd5',
              200: '#fed7aa',
              300: '#fdba74',
              400: '#fb923c',
              500: '#f97316',
              600: '#ea580c',
              700: '#c2410c',

  <style>
    html { overflow-y: auto; }

    /* 问卷系统样式 */
    .quiz-container {
      transition: opacity 0.3s ease;
    }

    .question-card {
      animation: fadeInUp 0.4s ease-out;
    }

    .fade-in {
      animation: fadeInUp 0.3s ease-out;
    }

    .animate-fade-in {
      animation: fadeInUp 0.5s ease-out;
    }

    @keyframes fadeInUp {
    from {
      opacity: 0;
      transform: translateY(20px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
    }

    .quiz-option {
      transition: all 0.2s ease;
    }

    /* Force proper text colors for quiz elements */
    .quiz-option,
    .quiz-option span,
    .question-content,
    .question-content h2 {
      color: #374151 !important; /* gray-700 */
    }

    /* Force minimum dimensions for quiz elements */
    #quiz-container,
    .quiz-container,
    .question-card {
      min-height: 200px !important;
      min-width: 300px !important;
    }

    .quiz-option {
      min-height: 50px !important;
    }

    .quiz-option:hover {
      transform: translateX(4px);
    }

    .quiz-option.selected {
      background-color: #fef3c7;
      border-color: #f97316;
    }

    /* 移动端优化 */
    @media (max-width: 640px) {
      .quiz-option {
        padding: 0.75rem;
      }
      .question-card {
        padding: 1.5rem;
      }

      /* 移动端AI横幅样式 */
      #ai-assistant-banner button {
        font-size: 0.75rem;
        padding: 0.5rem 0.75rem;
      }

      /* 移动端AI工具列表 */
      #ai-tools-list {
        top: 80px;
        max-height: 80vh;
        overflow-y: auto;
      }
    }

    /* Toast提示样式 */
    .quiz-toast {
      max-width: 90vw;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }

    /* 手机端按钮点击区域优化 */
    @media (max-width: 375px) {
      .quiz-option button,
      .quiz-navigation button,
      .action-buttons button {
        min-height: 44px;
        min-width: 120px;
      }
    }

    /* Debug: Force visibility for testing */
    #quiz-container,
    #quiz-container > div {
      display: block !important;
      visibility: visible !important;
      opacity: 1 !important;
      min-height: 100px !important;
    }

    /* Explicit styles for quiz elements (bypassing Tailwind for dynamic content) */
    .quiz-progress {
      margin-bottom: 2rem;
    }

    .quiz-progress .flex {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.5rem;
    }

    .question-card {
      background-color: white;
      border-radius: 0.75rem;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      padding: 2rem;
      margin-bottom: 1.5rem;
      display: block !important;
      min-height: 200px !important;
    }

    .quiz-option {
      padding: 1rem;
      border: 2px solid #e5e7eb;
      border-radius: 0.5rem;
      margin-bottom: 0.75rem;
      cursor: pointer;
      display: block !important;
      min-height: 50px !important;
      transition: all 0.2s ease;
    }

    .quiz-option:hover {
      border-color: #fdba74;
      background-color: #f9fafb;
    }

    .quiz-option.selected {
      background-color: #fef3c7;
      border-color: #f97316;
    }

    .quiz-option label {
      display: flex;
      align-items: center;
      width: 100%;
      cursor: pointer;
    }

    .quiz-option input[type="radio"],
    .quiz-option input[type="checkbox"] {
      width: 1.25rem;
      height: 1.25rem;
      color: #ea580c;
      cursor: pointer;
    }

    .quiz-option span {
      margin-left: 0.75rem;
      color: #374151;
    }

    .quiz-navigation {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 2rem;
    }

    .quiz-navigation button {
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      font-weight: 500;
      cursor: pointer;
      min-height: 44px;
    }

    .quiz-navigation button:disabled {
      background-color: #9ca3af;
      cursor: not-allowed;
    }

    .question-content h2 {
      font-size: 1.25rem;
      font-weight: bold;
      margin-bottom: 1.5rem;
      color: #111827;
      display: block !important;
    }

  <script>
    // AI陪跑横幅控制
    let isAIBannerCollapsed = false;

    function toggleAIBanner() {
      isAIBannerCollapsed = !isAIBannerCollapsed;
      const banner = document.getElementById('ai-assistant-banner');
      const toolsList = document.getElementById('ai-tools-list');

      if (isAIBannerCollapsed) {
        // 展开工具列表
        banner.innerHTML = `
          <div class="max-w-6xl mx-auto px-4 py-2">
            <div class="flex items-center justify-between">
              <button onclick="toggleAIBanner()"
                      class="text-white hover:text-blue-100 text-sm px-2 py-1 rounded transition-colors">
                💡 遇到报错？选择AI助手 ▼
              </button>
              <button onclick="toggleAIBanner()"
                      class="text-white hover:text-blue-100 text-sm px-2 py-1 rounded transition-colors">
                ✖ 关闭
              </button>
            </div>
          </div>
        `;
        toolsList.classList.remove('hidden');
      } else {
        // 收起工具列表
        banner.innerHTML = `
          <div class="max-w-6xl mx-auto px-4 py-2">
            <div class="flex items-center justify-between">
              <button onclick="toggleAIBanner()"
                      class="text-white hover:text-blue-100 text-sm px-2 py-1 rounded transition-colors">
                💡 遇到报错？打开一个AI助手帮你解决 ▾
              </button>
            </div>
          </div>
        `;
        toolsList.classList.add('hidden');
      }
    }

    // AI提示词
    const aiPrompts = {
      'doubao': '你好！我正在用一个网页教程学习安装和使用Claude Code（一个让AI直接在你电脑终端里帮你写代码的工具）。这个教程会一步一步带着我走，但如果我遇到报错或者不懂的地方，我会把问题截图或者代码粘贴到这里请你帮助。请用简单易懂的中文回答，不要假设我有编程基础。我们的目标是让我顺利完成Claude Code的安装和基础使用。',
      'wenxin': '你好！我正在用一个网页教程学习安装和使用Claude Code（一个让AI直接在你电脑终端里帮你写代码的工具）。这个教程会一步一步带着我走，但如果我遇到报错或者不懂的地方，我会把问题截图或者代码粘贴到这里请你帮助。请用简单易懂的中文回答，不要假设我有编程基础。我们的目标是让我顺利完成Claude Code的安装和基础使用。',
      'kimi': '你好！我正在用一个网页教程学习安装和使用Claude Code（一个让AI直接在你电脑终端里帮你写代码的工具）。这个教程会一步一步带着我走，但如果我遇到报错或者不懂的地方，我会把问题截图或者代码粘贴到这里请你帮助。请用简单易懂的中文回答，不要假设我有编程基础。我们的目标是让我顺利完成Claude Code的安装和基础使用。',
      'tongyi': '你好！我正在用一个网页教程学习安装和使用Claude Code（一个让AI直接在你电脑终端里帮你写代码的工具）。这个教程会一步一步带着我走，但如果我遇到报错或者不懂的地方，我会把问题截图或者代码粘贴到这里请你帮助。请用简单易懂的中文回答，不要假设我有编程基础。我们的目标是让我顺利完成Claude Code的安装和基础使用。',
      'chatgpt': '你好！我正在用一个网页教程学习安装和使用Claude Code（一个让AI直接在你电脑终端里帮你写代码的工具）。这个教程会一步一步带着我走，但如果我遇到报错或者不懂的地方，我会把问题截图或者代码粘贴到这里请你帮助。请用简单易懂的中文回答，不要假设我有编程基础。我们的目标是让我顺利完成Claude Code的安装和基础使用。',
      'gemini': '你好！我正在用一个网页教程学习安装和使用Claude Code（一个让AI直接在你电脑终端里帮你写代码的工具）。这个教程会一步一步带着我走，但如果我遇到报错或者不懂的地方，我会把问题截图或者代码粘贴到这里请你帮助。请用简单易懂的中文回答，不要假设我有编程基础。我们的目标是让我顺利完成Claude Code的安装和基础使用。',
      'claude': '你好！我正在用一个网页教程学习安装和使用Claude Code（一个让AI直接在你电脑终端里帮你写代码的工具）。这个教程会一步一步带着我走，但如果我遇到报错或者不懂的地方，我会把问题截图或者代码粘贴到这里请你帮助。请用简单易懂的中文回答，不要假设我有编程基础。我们的目标是让我顺利完成Claude Code的安装和基础使用。'
    };

    function copyAIPrompt(aiService) {
      const prompt = aiPrompts[aiService];
      if (prompt) {
        navigator.clipboard.writeText(prompt).then(() => {
          alert(`✅ ${aiService} 提示词已复制到剪贴板！`);
        }).catch(err => {
          console.error('复制失败:', err);
          alert('复制失败，请手动选择文本复制');
        });
      }
    }

    // 页面加载后初始化问卷
    (function() {
      function initQuiz() {
        if (typeof Quiz !== 'undefined') {
          window.quiz = new Quiz();
        } else {
          console.error('Quiz类未定义，无法初始化问卷');
        }
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initQuiz);
      } else {
        initQuiz();
      }
    })();
  </script>
